<title>Word Garden — English, Math &amp; Telugu Learning Adventure</title>
<style>
  :root{
    --yellow:#FFC93C; --yellow-deep:#FFA000;
    --sky:#4FC3F7; --sky-deep:#039BE5;
    --grass:#66BB6A; --grass-deep:#43A047;
    --coral:#FF6F91; --coral-deep:#F4436C;
    --grape:#8B5CF6; --grape-deep:#7C3AED;
    --plum:#3D2465; --cream:#FFF8E7; --white:#FFFFFF;
    --shadow: 0 8px 0 rgba(61,36,101,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito','Noto Sans Telugu',sans-serif;
    background:
      radial-gradient(circle at 10% 10%, #FFF3C4 0%, transparent 40%),
      radial-gradient(circle at 90% 20%, #D6F5FF 0%, transparent 45%),
      radial-gradient(circle at 20% 90%, #E3F9E5 0%, transparent 40%),
      var(--cream);
    color:var(--plum); min-height:100vh; overflow-x:hidden;
  }
  h1,h2,h3,button,.display{font-family:'Baloo 2','Noto Sans Telugu',cursive;}
  #app{max-width:900px;margin:0 auto;padding:18px 16px 60px;position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .owl{font-size:2.2rem;animation:float 3s ease-in-out infinite;}
  .brand-text h1{margin:0;font-size:1.5rem;color:var(--plum);}
  .brand-text span{font-size:.8rem;color:#8069A8;font-weight:700;}
  .stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .pill{background:var(--white);border-radius:999px;padding:8px 14px;box-shadow:0 4px 0 rgba(61,36,101,0.12);
    font-weight:800;display:flex;align-items:center;gap:6px;font-size:.95rem;}
  .pill.stars{color:var(--yellow-deep);}
  .pill.who{color:var(--plum);}
  .home-btn{background:var(--white);border:none;border-radius:999px;padding:8px 16px;
    font-family:'Baloo 2';font-weight:700;color:var(--plum);cursor:pointer;box-shadow:0 4px 0 rgba(61,36,101,0.12);}
  .home-btn:hover{transform:translateY(-1px);}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-8px) rotate(3deg);}}

  .card{background:var(--white);border-radius:28px;padding:28px 24px;box-shadow:var(--shadow);margin-bottom:18px;}
  .screen-title{text-align:center;margin:6px 0 4px;color:var(--plum);font-size:1.6rem;}
  .screen-sub{text-align:center;color:#8069A8;font-weight:700;margin:0 0 22px;}
  .hoot-msg{display:flex;gap:12px;align-items:flex-start;background:#FFF3C4;border-radius:20px;padding:14px 16px;
    margin-bottom:20px;font-weight:700;color:#7A5A00;}
  .hoot-msg .bubble-owl{font-size:1.8rem;flex-shrink:0;}

  /* name / profile screen */
  .avatar-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 20px;}
  .avatar-btn{border:3px solid transparent;background:#F5F0FF;border-radius:16px;font-size:1.8rem;
    padding:10px 14px;cursor:pointer;}
  .avatar-btn.selected{border-color:var(--grape-deep);background:#EDE3FF;}
  .name-input{font-family:'Baloo 2';font-size:1.4rem;text-align:center;padding:14px;border-radius:16px;
    border:3px solid #E3D9F5;width:100%;max-width:360px;outline:none;color:var(--plum);background:#FBF9FF;display:block;margin:0 auto;}
  .name-input:focus{border-color:var(--sky);}
  .profile-list{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 6px;}
  .profile-pill{background:var(--white);border:3px solid #EADFFB;border-radius:999px;padding:10px 18px;
    font-family:'Baloo 2';font-weight:700;cursor:pointer;box-shadow:0 4px 0 rgba(61,36,101,0.08);}
  .profile-pill:hover{border-color:var(--sky);}
  .divider{text-align:center;color:#B4A6CE;font-weight:800;margin:18px 0;}

  /* stats dashboard */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .stat-box{background:#F5F0FF;border-radius:16px;padding:14px 6px;text-align:center;}
  .stat-num{font-family:'Baloo 2';font-size:1.6rem;font-weight:800;color:var(--grape-deep);}
  .stat-lbl{font-size:.72rem;font-weight:700;color:#8069A8;}
  .stat-bars{display:flex;flex-direction:column;gap:9px;}
  .stat-bar-row{display:flex;align-items:center;gap:10px;}
  .stat-bar-label{width:28px;text-align:center;font-size:1.15rem;flex-shrink:0;}
  .stat-bar-track{flex:1;height:11px;background:#EEE7FA;border-radius:99px;overflow:hidden;}
  .stat-bar-fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--grass));border-radius:99px;}
  .stat-bar-val{width:26px;text-align:right;font-weight:800;color:#8069A8;font-size:.85rem;flex-shrink:0;}

  /* age / level / subject grid */
  .age-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:16px;}
  .age-card{border:none;border-radius:24px;padding:22px 14px;cursor:pointer;text-align:center;color:var(--white);
    font-family:'Baloo 2';box-shadow:0 6px 0 rgba(0,0,0,0.15);transition:transform .12s ease;}
  .age-card:hover{transform:translateY(-4px) scale(1.02);}
  .age-card:active{transform:translateY(1px);}
  .age-card .emoji{font-size:2.6rem;display:block;margin-bottom:8px;}
  .age-card .title{font-size:1.15rem;font-weight:800;}
  .age-card .sub{font-size:.8rem;font-weight:600;opacity:.9;}
  .age-1{background:linear-gradient(160deg,#FF9E9E,var(--coral-deep));}
  .age-2{background:linear-gradient(160deg,#FFD37A,var(--yellow-deep));}
  .age-3{background:linear-gradient(160deg,#8CE3A0,var(--grass-deep));}
  .age-4{background:linear-gradient(160deg,#7FD8F5,var(--sky-deep));}
  .age-5{background:linear-gradient(160deg,#C4A6FF,var(--grape-deep));}
  .age-6{background:linear-gradient(160deg,#FFB199,var(--coral-deep));}
  .subj-card{border:none;border-radius:26px;padding:30px 16px;cursor:pointer;text-align:center;color:var(--white);
    font-family:'Baloo 2';box-shadow:0 7px 0 rgba(0,0,0,0.15);transition:transform .12s ease;}
  .subj-card:hover{transform:translateY(-4px) scale(1.02);}
  .subj-card .emoji{font-size:3rem;display:block;margin-bottom:10px;}
  .subj-card .title{font-size:1.3rem;font-weight:800;}
  .subj-card .sub{font-size:.82rem;font-weight:600;opacity:.9;}
  .subj-en{background:linear-gradient(160deg,#8CE3A0,var(--grass-deep));}
  .subj-ma{background:linear-gradient(160deg,#7FD8F5,var(--sky-deep));}
  .subj-te{background:linear-gradient(160deg,#FFB199,var(--coral-deep));}

  .mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;}
  .mode-card{border:none;border-radius:22px;padding:20px;cursor:pointer;text-align:left;background:var(--white);
    border:3px solid transparent;box-shadow:0 5px 0 rgba(61,36,101,0.1);transition:transform .12s ease, border-color .12s ease;}
  .mode-card:hover{transform:translateY(-3px);}
  .mode-card .emoji{font-size:2.1rem;}
  .mode-card h3{margin:8px 0 4px;font-size:1.1rem;}
  .mode-card p{margin:0;font-size:.82rem;color:#8069A8;font-weight:700;}
  .mode-card.c-read{border-color:#FFD37A;}
  .mode-card.c-write{border-color:#8CE3A0;}
  .mode-card.c-speak{border-color:#7FD8F5;}
  .mode-card.c-games{border-color:#C4A6FF;}
  .mode-card.c-rhyme{border-color:#FFB1C6;}
  .mode-card.c-hunt{border-color:#B7E3FF;}
  .mode-card.c-speed{border-color:#FFE08A;}
  .mode-card.c-miss{border-color:#C9F5C1;}
  .mode-card.c-check{border-color:#FFD1E8;}
  .mode-card.c-eq{border-color:#D8C4FF;}
  .mode-card.c-sent{border-color:#FFC9A8;}
  .mode-card.c-dig{border-color:#B8F0DA;}

  .stage{text-align:center;}
  .word-emoji{font-size:5rem;margin:8px 0;animation:pop .35s ease;}
  .math-visual{font-size:2.5rem;margin:10px 0;animation:pop .35s ease;line-height:1.6;}
  @keyframes pop{0%{transform:scale(.5);opacity:0;}80%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  .word-big{font-size:3.2rem;font-weight:800;letter-spacing:2px;color:var(--plum);margin:6px 0 10px;font-family:'Baloo 2','Noto Sans Telugu';}
  .word-big.sentence{font-size:1.9rem;letter-spacing:0;}
  .blank-slot{background:#FFE8B3;border-radius:10px;padding:2px 14px;}

  .phon-row{margin:6px 0 20px;}
  .phon-word{display:inline-block;margin:0 6px 8px;}
  .letter-chip{display:inline-block;border-radius:12px;padding:6px 10px;margin:2px;font-weight:800;color:var(--white);
    font-family:'Baloo 2';font-size:1.1rem;}
  .chip-vowel{background:var(--grass-deep);}
  .chip-consonant{background:var(--grape-deep);}
  .chip-digraph{background:var(--coral-deep);}
  .phon-label{display:block;font-size:.75rem;color:#8069A8;font-weight:700;margin:0 0 6px;}

  .progress-track{height:12px;background:#EEE7FA;border-radius:99px;overflow:hidden;margin:0 0 20px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--grass),var(--sky));border-radius:99px;transition:width .3s ease;}

  .btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .btn{border:none;border-radius:16px;padding:14px 22px;font-family:'Baloo 2';font-weight:700;font-size:1.05rem;
    cursor:pointer;color:var(--white);box-shadow:0 5px 0 rgba(0,0,0,0.15);transition:transform .1s ease;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,0.15);}
  .btn-yellow{background:var(--yellow-deep);color:#4A2E00;}
  .btn-blue{background:var(--sky-deep);}
  .btn-green{background:var(--grass-deep);}
  .btn-pink{background:var(--coral-deep);}
  .btn-purple{background:var(--grape-deep);}
  .btn-grey{background:#B9AFC9;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.small{padding:9px 16px;font-size:.9rem;border-radius:12px;}

  .write-input{font-family:'Baloo 2','Noto Sans Telugu';font-size:1.8rem;text-align:center;letter-spacing:4px;padding:14px;
    border-radius:16px;border:3px solid #E3D9F5;width:100%;max-width:420px;outline:none;color:var(--plum);background:#FBF9FF;}
  .write-input:focus{border-color:var(--sky);}
  .feedback{font-weight:800;font-size:1.1rem;min-height:1.6rem;margin-top:14px;}
  .feedback.good{color:var(--grass-deep);}
  .feedback.bad{color:var(--coral-deep);}

  .memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:0 auto;}
  .mem-card{aspect-ratio:1/1;background:var(--grape-deep);border-radius:14px;display:flex;align-items:center;
    justify-content:center;font-size:1.4rem;cursor:pointer;color:var(--white);font-family:'Baloo 2','Noto Sans Telugu';font-weight:800;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);user-select:none;transition:transform .15s ease, background .15s ease;text-align:center;padding:4px;}
  .mem-card.flipped{background:var(--white);color:var(--plum);border:3px solid var(--sky);}
  .mem-card.matched{background:#DFF5E1;color:var(--grass-deep);border:3px solid var(--grass-deep);cursor:default;}

  .slot-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:64px;margin-bottom:18px;}
  .slot{width:52px;height:56px;border-radius:12px;background:#F0EAFB;border:3px dashed #D4C4F2;display:flex;
    align-items:center;justify-content:center;font-family:'Baloo 2','Noto Sans Telugu';font-size:1.6rem;font-weight:800;color:var(--plum);}
  .slot.filled{border-style:solid;background:#EAF7FF;border-color:var(--sky);}
  .tile-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
  .tile{min-width:52px;height:56px;padding:0 10px;border-radius:12px;background:var(--yellow-deep);color:#4A2E00;
    display:flex;align-items:center;justify-content:center;font-family:'Baloo 2','Noto Sans Telugu';font-size:1.4rem;font-weight:800;
    cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,0.15);user-select:none;}
  .tile.used{opacity:.25;pointer-events:none;}
  .tile.word-tile{min-width:auto;padding:0 16px;font-size:1.1rem;}

  .quiz-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;max-width:560px;margin:0 auto;}
  .quiz-opt{background:var(--white);border:3px solid #E3D9F5;border-radius:18px;padding:18px 10px;font-size:2rem;
    cursor:pointer;box-shadow:0 4px 0 rgba(61,36,101,0.1);}
  .quiz-opt.word-opt{font-family:'Baloo 2','Noto Sans Telugu';font-size:1.3rem;font-weight:800;color:var(--plum);}
  .quiz-opt:hover{border-color:var(--sky);}
  .quiz-opt.correct{background:#DFF5E1;border-color:var(--grass-deep);}
  .quiz-opt.wrong{background:#FDE2E7;border-color:var(--coral-deep);}

  .rhyme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;max-width:560px;margin:0 auto;}
  .rhyme-card{background:var(--white);border:3px solid #E3D9F5;border-radius:18px;padding:16px 8px;cursor:pointer;
    box-shadow:0 4px 0 rgba(61,36,101,0.1);text-align:center;}
  .rhyme-card .re{font-size:1.4rem;display:block;}
  .rhyme-card .rw{font-family:'Baloo 2','Noto Sans Telugu';font-weight:800;font-size:1.05rem;}
  .rhyme-card.selected{border-color:var(--sky-deep);background:#EAF7FF;}
  .rhyme-card.matched{border-color:var(--grass-deep);background:#DFF5E1;cursor:default;}

  .hunt-target{text-align:center;background:#FFF3C4;border-radius:18px;padding:14px;margin-bottom:18px;font-family:'Baloo 2';
    font-weight:800;color:#7A5A00;font-size:1.15rem;}
  .hunt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;max-width:560px;margin:0 auto;}
  .hunt-tile{background:var(--white);border:3px solid #E3D9F5;border-radius:18px;padding:16px 8px;cursor:pointer;
    box-shadow:0 4px 0 rgba(61,36,101,0.1);text-align:center;}
  .hunt-tile .he{font-size:1.6rem;display:block;}
  .hunt-tile .hw{font-family:'Baloo 2','Noto Sans Telugu';font-weight:800;}
  .hunt-tile.picked{border-color:var(--grape-deep);background:#F1E9FF;}
  .hunt-tile.right{border-color:var(--grass-deep);background:#DFF5E1;}
  .hunt-tile.wrong{border-color:var(--coral-deep);background:#FDE2E7;}

  .timer-badge{display:inline-block;background:var(--coral-deep);color:var(--white);font-family:'Baloo 2';
    font-weight:800;border-radius:999px;padding:8px 20px;font-size:1.3rem;margin-bottom:16px;}
  .speed-count{font-weight:800;color:#8069A8;margin-top:8px;}

  .back-link{background:none;border:none;color:#8069A8;font-family:'Baloo 2';font-weight:700;cursor:pointer;
    font-size:.95rem;margin-bottom:10px;padding:6px 0;}
  .back-link:hover{color:var(--plum);}
  .activity-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}

  #micBtn.mic-listening{animation:micPulse 1s ease-in-out infinite;}
  @keyframes micPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);box-shadow:0 0 0 10px rgba(244,67,108,0.15);}}

  .praise-pop{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);font-family:'Baloo 2';font-size:2.2rem;
    font-weight:800;color:var(--grass-deep);background:var(--white);padding:16px 30px;border-radius:22px;
    box-shadow:0 10px 0 rgba(0,0,0,0.15);z-index:1000;animation:praisePop 1.3s ease forwards;text-align:center;
    pointer-events:none;}
  @keyframes praisePop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0;}
    18%{transform:translate(-50%,-50%) scale(1.15);opacity:1;}
    32%{transform:translate(-50%,-50%) scale(1);opacity:1;}
    80%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-62%) scale(1);}}

  .confetti-piece{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;z-index:999;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.9;}}

  footer{text-align:center;color:#B4A6CE;font-size:.8rem;font-weight:700;margin-top:28px;}
  .credits{margin-top:6px;font-size:.75rem;color:#C9BEDD;font-weight:700;}

  @media (max-width:480px){
    .word-big{font-size:2.3rem;}
    .word-big.sentence{font-size:1.4rem;}
    .math-visual{font-size:1.9rem;}
    .memory-grid{grid-template-columns:repeat(3,1fr);}
    .stat-grid{grid-template-columns:repeat(3,1fr);}
  }

  /* ================= v2 additions ================= */
  .wrong-pop{color:var(--coral-deep)!important;}
  .mark-x{font-weight:900;color:var(--coral-deep);margin-right:5px;font-size:1.2rem;}
  .shake{animation:shakeIt .45s ease;}
  @keyframes shakeIt{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

  .round-done{text-align:center;padding:6px 4px;}
  .round-done .big{font-size:3.6rem;line-height:1;}
  .round-score{font-family:'Baloo 2';font-size:1.35rem;color:var(--grape-deep);font-weight:800;margin:8px 0 4px;}
  .profile-row{display:flex;align-items:center;gap:8px;justify-content:center;margin:6px 0;}
  .mini-x{border:none;background:#FFE3EA;color:var(--coral-deep);font-weight:900;border-radius:50%;
    width:30px;height:30px;cursor:pointer;font-size:.85rem;}

  .mini-q{font-family:'Baloo 2';font-size:1.1rem;color:var(--plum);font-weight:800;margin-bottom:8px;}
  .ten-frame{display:inline-grid;grid-template-columns:repeat(5,30px);grid-auto-rows:30px;gap:3px;
    padding:5px;background:var(--white);border-radius:10px;box-shadow:0 4px 0 rgba(61,36,101,.10);
    margin:5px;vertical-align:middle;}

  .tf-cell.on{background:#FFE9F0;border-color:var(--coral);}
  .tf-cell.tappable{cursor:pointer;}
  .tf-dot{width:15px;height:15px;border-radius:50%;background:var(--coral-deep);}
  .tf-label{font-size:.8rem;font-weight:800;color:#8069A8;}

  .num-track{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:10px 0;}
  .num-cell{min-width:38px;height:42px;border:2px solid #C9BEDD;border-radius:9px;background:var(--white);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;color:var(--plum);}
  .num-cell.start{background:#FFF3C4;border-color:var(--yellow-deep);}
  .num-cell.land{background:#E3F9E5;border-color:var(--grass-deep);}
  .num-cell.tappable{cursor:pointer;}
  .num-cell.badpick{background:#FFE3EA;border-color:var(--coral-deep);}

  .obj-row{font-size:1.6rem;letter-spacing:2px;line-height:1.6;word-break:break-word;}
  .cmp-row{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:6px;flex-wrap:wrap;}
  .cmp-item{text-align:center;}
  .cmp-item em{display:block;font-style:normal;font-size:.85rem;font-weight:800;color:#8069A8;margin-top:2px;}

  .bal-side{text-align:center;}
  .bal-side.up{transform:translateY(-16px);}
  .bal-side.down{transform:translateY(16px);}
  .bal-side em{display:block;font-style:normal;font-size:.8rem;font-weight:800;color:#8069A8;}

  .coin-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0;}
  .coin{width:68px;height:68px;border-radius:50%;background:linear-gradient(#FFEDB0,#FFC93C);

    font-family:'Baloo 2';font-weight:800;font-size:1.2rem;color:#7A5300;cursor:pointer;
    box-shadow:0 5px 0 rgba(61,36,101,.18);user-select:none;}
  .coin:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(61,36,101,.18);}
  .coin.small{width:50px;height:50px;font-size:.95rem;cursor:pointer;}
  .price-tag{font-family:'Baloo 2';font-size:1.5rem;font-weight:800;color:var(--grape-deep);}
  .purse{min-height:62px;border:3px dashed #C9BEDD;border-radius:16px;padding:8px;margin:10px 0;
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;}
  .purse-total{font-weight:800;color:var(--plum);font-size:1.05rem;}

  .te-chip{display:inline-block;background:var(--white);border:3px solid #E7DEFA;border-radius:14px;

  .gunint-eq{font-family:'Noto Sans Telugu',sans-serif;font-size:2.2rem;font-weight:700;color:var(--plum);margin:10px 0;}
  .te-line{font-family:'Noto Sans Telugu',sans-serif;}

  .skill-badge{position:absolute;top:8px;right:10px;font-family:'Baloo 2';font-weight:800;
    font-size:.72rem;letter-spacing:1px;color:var(--white);background:rgba(61,36,101,.55);
    border-radius:999px;padding:2px 9px;}
  .mode-card{position:relative;}
  .lsrw-key{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0 16px;}
  .lsrw-pill{font-family:'Baloo 2';font-weight:800;font-size:.78rem;color:var(--plum);

  .listen-big{font-size:4.2rem;margin:14px 0;}
  .listen-hint{font-weight:800;color:#8069A8;font-size:.95rem;margin-bottom:8px;}

/* ---- small visual builders shared by the maths screens ---- */
function tenFrameHTML(n, tappable, handler){
  let cells = "";
  for(let i=0;i<10;i++){
    const on = i < n;
    cells += `<div class="tf-cell${on?' on':''}${tappable?' tappable':''}"`
           + (tappable ? ` onclick="${handler}(${i})"` : "")
           + `>${on?'<span class="tf-dot"></span>':''}</div>`;
  }
  return `<span class="ten-frame">${cells}</span>`;
}
function numTrackHTML(from, to, marks){
  marks = marks || {};
  let out = "";
  for(let n=from;n<=to;n++){
    let cls = "num-cell";
    if(marks.start === n) cls += " start";
    if(marks.land === n) cls += " land";
    out += `<div class="${cls}">${n}</div>`;
  }
  return `<div class="num-track">${out}</div>`;
}
function objRow(emoji, n){ return `<div class="obj-row">${emoji.repeat(n)}</div>`; }
function miniQ(t){ return `<div class="mini-q">${t}</div>`; }
function rupee(n){ return "₹" + n; }

function mathItemsFor(level, batchIdx){
  const bank = MATH_SETS[level] || MATH_SETS[1];
  const raw  = bank[batchIdx] || bank[0];

  if(level === 1){
    return raw.map(it=>{
      const vis = it.n === 0
        ? `${miniQ("How many are on the plate?")}<div class="obj-row">🍽️</div><div class="tf-label">none at all</div>`
        : `${miniQ("How many can you count?")}${objRow(it.e, it.n)}`;
      return {w:String(it.n), e:vis, solved:vis, kind:"count",
              gw:String(it.n), ge:NUMBER_WORDS[it.n], say:`${it.n}. ${NUMBER_WORDS[it.n]}.`};
    });
  }
  if(level === 2){
    return raw.map(it=>{
      const vis = `${miniQ("Count them and say the number")}${objRow(it.e, it.n)}`;
      return {w:String(it.n), e:vis, solved:vis, kind:"count",
              gw:String(it.n), ge:it.e.repeat(it.n), say:`${it.n}`};
    });
  }
  if(level === 3){
    return raw.map(it=>{
      const ans = 10 + it.k;
      const vis = `${miniQ("One frame is full. Count on from 10.")}`
        + `<div>${tenFrameHTML(10)}${tenFrameHTML(it.k)}</div>`
        + `<div class="tf-label">10 and ${it.k} more</div>`;
      return {w:String(ans), e:vis, solved:vis + `<div class="tf-label">10 + ${it.k} = ${ans}</div>`,
              kind:"tenframe", k:it.k, gw:String(ans), ge:`10 + ${it.k}`,
              say:`Ten and ${it.k} more makes ${ans}.`};
    });
  }
  if(level === 4){
    return raw.map(it=>{
      const ans = 10 - it.a;
      const vis = `${miniQ("How many more spots make ten?")}`
        + `<div class="obj-row">${"🔴".repeat(it.a)} <span class="blank-slot">?</span></div>`
        + `<div class="tf-label">${it.a} red spots and ? blue spots = 10</div>`;
      return {w:String(ans), e:vis, solved:`${miniQ("How many more spots make ten?")}`
              + `<div class="obj-row">${"🔴".repeat(it.a)}${"🔵".repeat(ans)}</div>`
              + `<div class="tf-label">${it.a} + ${ans} = 10</div>`,
              kind:"maketen", a:it.a, gw:String(ans), ge:`${it.a} + ? = 10`,
              say:`${it.a} and ${ans} make ten.`};
    });
  }
  if(level === 5){
    return raw.map(it=>{
      const diff = Math.abs(it.b - it.a);
      const vis = `${miniQ("How many more in the bigger row?")}`
        + objRow(it.e1, it.a) + objRow(it.e2, it.b);
      return {w:String(diff), e:vis, solved:vis + `<div class="tf-label">${Math.max(it.a,it.b)} − ${Math.min(it.a,it.b)} = ${diff}</div>`,
              kind:"difference", a:it.a, b:it.b,
              gw:String(diff), ge:`${Math.max(it.a,it.b)} − ${Math.min(it.a,it.b)}`,
              say:`The difference between ${it.a} and ${it.b} is ${diff}.`};
    });
  }
  if(level === 6){
    return raw.map(it=>{
      const land = it.s - it.b;
      const vis = `${miniQ(`The turtle 🐢 sits on ${it.s} and swims back ${it.b}. Where does it land?`)}`
        + numTrackHTML(1, 10, {start: it.s});
      return {w:String(land), e:vis, solved:`${miniQ(`Start at ${it.s}, count back ${it.b}.`)}` + numTrackHTML(1,10,{start:it.s, land:land}),
              kind:"countback", s:it.s, b:it.b,
              gw:String(land), ge:`${it.s} back ${it.b}`,
              say:`Start at ${it.s}, count back ${it.b}. The turtle lands on ${land}.`};
    });
  }
  if(level === 7){
    return raw.map(it=>{
      const ans = Math.abs(it.a - it.b);
      const q = it.diff ? `Find the difference between ${it.a} and ${it.b}.`
                        : `Subtract ${it.b} from ${it.a}.`;
      const vis = `${miniQ(q)}<div class="obj-row">${"⭕".repeat(Math.max(it.a,it.b))}</div>` + numTrackHTML(1,10,{});
      return {w:String(ans), e:vis,
              solved:`${miniQ(q)}` + numTrackHTML(1,10,{land:ans}) + `<div class="tf-label">${Math.max(it.a,it.b)} − ${Math.min(it.a,it.b)} = ${ans}</div>`,
              kind:"subtract", a:it.a, b:it.b,
              gw:String(ans), ge:`${Math.max(it.a,it.b)} − ${Math.min(it.a,it.b)}`,
              say:`${Math.max(it.a,it.b)} take away ${Math.min(it.a,it.b)} leaves ${ans}.`};
    });
  }
  if(level === 8){
    return raw.map(it=>{
      const row = it.opts.map(o=>`<span class="cmp-item"><span style="font-size:${o.s}rem;">${o.e}</span><em>${o.n}</em></span>`).join("");
      const vis = miniQ(it.q) + `<div class="cmp-row">${row}</div>`;
      const ans = it.ask === "shortest" ? it.opts[it.opts.length-1].n : it.opts[0].n;
      return {w:ans, e:vis, solved:vis + `<div class="tf-label">Answer: ${ans}</div>`,
              kind:"length", choices:it.opts.map(o=>o.n),
              gw:ans, ge:(it.ask==="shortest"?it.opts[it.opts.length-1].e:it.opts[0].e),
              say:`${it.q} The ${ans}.`};
    });
  }
  if(level === 9){
    return raw.map(it=>{
      const vis = miniQ(it.q)
        + `<div class="bal-row"><span class="bal-side up">${it.light.e}<em>${it.light.n}</em></span>⚖️`
        + `<span class="bal-side down">${it.heavy.e}<em>${it.heavy.n}</em></span></div>`;
      const ans = it.ask === "heavier" ? it.heavy.n : it.light.n;
      return {w:ans, e:vis, solved:vis + `<div class="tf-label">Answer: ${ans}</div>`,
              kind:"mass", choices:[it.heavy.n, it.light.n],
              gw:ans, ge:(it.ask==="heavier"?it.heavy.e:it.light.e),
              say:`${it.q} The ${ans} is ${it.ask}.`};
    });
  }
  if(level === 10){
    return raw.map(it=>{
      const total = it.c.reduce((s,v)=>s+v,0);
      const coins = it.c.map(v=>`<span class="coin small">${rupee(v)}</span>`).join("");
      const vis = miniQ("How much money is this? (in rupees)") + `<div class="coin-row">${coins}</div>`;
      return {w:String(total), e:vis, solved:vis + `<div class="tf-label">Total = ${rupee(total)}</div>`,
              kind:"money", coins:it.c,
              gw:String(total), ge:it.c.map(v=>rupee(v)).join(" + "),
              say:`${it.c.join(" rupees plus ")} rupees makes ${total} rupees.`};
    });
  }
  /* level 11 — shapes */
  return raw.map(it=>({w:it.shape, e:miniQ("What shape is this?") + `<div class="obj-row" style="font-size:3rem;">${it.e}</div>`,
                       solved:`<div class="obj-row" style="font-size:3rem;">${it.e}</div>`, kind:"shape",
                       gw:it.shape, ge:it.e, say:it.shape}));
}

function guninthamItems(base){
  const br = (TE_BASE_ROMAN[base] || base).slice(0,-1);
  return TE_SIGNS.map(s=>{
    const ch = base + s.sign;
    return {w:ch,
            e:`<span class="te-chip">${base}</span> + <span class="te-chip">${s.sign || "—"}</span>`
              + `<div class="tf-label">${base} with ${s.vowel}</div>`,
            roman: br + s.roman, base:base, sign:s.sign, vowelName:s.vowel};
  });
}

/* ---------------- Phonics engine (Jolly-Phonics-style pure sounds, English only) ---------------- */
const DIGRAPHS = ["tch","dge","igh","ear","air","ure","sh","ch","th","ph","wh","ck","ng","qu","ai","ay","ee","ea",
  "oa","ow","oo","ou","oi","oy","ar","er","ir","or","ur","oe","ue","ie","kn","wr"].sort((a,b)=>b.length-a.length);

const LETTER_SOUNDS = { a:"a", b:"buh", c:"kuh", d:"duh", e:"eh", f:"ffff", g:"guh", h:"hh",
  i:"ih", j:"juh", k:"kuh", l:"lll", m:"mmm", n:"nnn", o:"o", p:"puh", q:"kwuh", r:"rrr",
  s:"sss", t:"t", u:"uh", v:"vvv", w:"wuh", x:"ks", y:"yuh", z:"zzz" };

function phonicsChunks(wordRaw){
  const word = wordRaw.toLowerCase().replace(/[^a-z]/g,"");
  let chunks = [], i = 0;
  while(i < word.length){
    let matched = null;
    for(const d of DIGRAPHS){ if(word.slice(i, i+d.length) === d){ matched = d; break; } }
    if(matched){ chunks.push(matched); i += matched.length; }
    else{ chunks.push(word[i]); i += 1; }
  }
  return chunks;
}
function chunkSpeech(chunk){ return chunk.length === 1 ? (LETTER_SOUNDS[chunk] || chunk) : chunk; }
function chunkClass(chunk){ if(chunk.length > 1) return "chip-digraph"; return /[aeiou]/.test(chunk) ? "chip-vowel" : "chip-consonant"; }
function phonicsChipHTML(word){ return phonicsChunks(word).map(c=>`<span class="letter-chip ${chunkClass(c)}">${c}</span>`).join(""); }
function phonicsDisplay(text){
  if(state.levelId === 5){
    return text.replace(/\./g,"").split(" ").map(w=>`<span class="phon-word">${phonicsChipHTML(w)}</span>`).join(" ");
  }
  return phonicsChipHTML(text);
}

/* ---- Telugu equivalents of the phonics row / sound-it-out button ---- */
function teluguChipHTML(word){
  const parts = teAksharas(word);
  if(parts.length < 2) return "";
  return parts.map(p=>`<span class="letter-chip chip-digraph">${p}</span>`).join("");
}
function teluguPhonRow(item){
  const chips = teluguChipHTML(item.w);
  if(chips) return `<span class="phon-label">అక్షరాలు — syllables:</span><div class="phon-row">${chips}</div>`;
  const word = teOnly(item.e);
  if(word && word !== teKey(item.w))
    return `<span class="phon-label">${item.w} in a word:</span><div class="phon-row"><span class="letter-chip chip-vowel">${word}</span></div>`;
  return "";
}
function teluguSoundBtn(item){
  if(teAksharas(item.w).length > 1)
    return `<button class="btn btn-purple" onclick="soundItOut(curItem().w)">🔤 Sound it out</button>`;
  const word = teOnly(item.e);
  if(word && word !== teKey(item.w) && teHas(word))
    return `<button class="btn btn-purple" onclick="teluguTeach(curItem())">🔤 Letter &amp; word</button>`;
  return "";
}

/* ---------------- Voice selection ---------------- */
let selectedVoice = null, selectedTeluguVoice = null;
const FEMALE_HINTS = ["female","heera","veena","lekha","kalpana","priya","kajal","zira","samantha","victoria","karen","moira","tessa","fiona","susan","allison","ava","emma","olivia","salli","joanna","kendra","ivy","aria","jenny"];
const MALE_HINTS = ["male","ravi","rishi","prabhat","david","mark","daniel","george","fred","alex","guy","christopher","eric","ryan"];
function pickBestVoice(){
  if(!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  if(voices.length === 0) return null;
  let best = null, bestScore = -999;
  voices.forEach(v=>{
    const lang = (v.lang||"").toLowerCase();
    const name = (v.name||"").toLowerCase();
    let score = 0;
    if(lang === "en-in") score += 50;
    else if(lang.startsWith("en-in")) score += 45;
    else if(lang.startsWith("en")) score += 8;
    else score -= 20;
    if(name.includes("india") || name.includes("indian")) score += 15;
    FEMALE_HINTS.forEach(h=>{ if(name.includes(h)) score += 12; });
    MALE_HINTS.forEach(h=>{ if(name.includes(h)) score -= 18; });
    if(score > bestScore){ bestScore = score; best = v; }
  });
  return best;
}
/* Only ever returns a GENUINE Telugu voice. The old version fell back to the
   best-scoring voice of any language, so on a device with no Telugu installed
   (Fire TV, most Windows PCs) it handed Telugu text to an English voice —
   which plays nothing at all, or reads it with an English accent. */
function pickBestTeluguVoice(){
  if(!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  if(voices.length === 0) return null;
  let best = null, bestScore = -1;
  voices.forEach(v=>{
    const lang = (v.lang||"").toLowerCase().replace("_","-");
    const name = (v.name||"").toLowerCase();
    if(!(lang === "te" || lang.startsWith("te-") || name.includes("telugu"))) return;
    let score = 10;
    if(lang === "te-in") score += 20;
    /* neural / online voices sound native; the old local ones are robotic */
    if(/natural|neural|online|enhanced|premium/.test(name)) score += 25;
    FEMALE_HINTS.forEach(h=>{ if(name.includes(h)) score += 8; });
    if(score > bestScore){ bestScore = score; best = v; }
  });
  return best;
}
function ensureVoice(){ selectedVoice = pickBestVoice(); selectedTeluguVoice = pickBestTeluguVoice(); }
if(window.speechSynthesis){
  ensureVoice();
  window.speechSynthesis.onvoiceschanged = ensureVoice;
}

/* ================= NATIVE TELUGU AUDIO =================
   Device text-to-speech cannot say Telugu on the machines this app runs on
   (Fire TV, Windows, most Android tablets ship no Telugu voice), so every
   Telugu letter, word and syllable is pre-recorded with a native te-IN
   neural voice and embedded below as base64 mp3. Playback is a plain
   <audio> element, which works in every browser including Fire TV Silk.
   TE_AUDIO / TE_AKSHARAS are defined near the end of the file. */
const TE_CHAR = /[ఀ-౿]/;
function hasTelugu(s){ return TE_CHAR.test(s||""); }
function teOnly(s){ return (s||"").replace(/[^ఀ-౿‌‍\s]/g,"").trim(); }
function teKey(s){ return (s||"").replace(/\s+/g," ").trim(); }
function teHas(s){ return typeof TE_AUDIO !== "undefined" && !!TE_AUDIO[teKey(s)]; }

let teCache = {}, teToken = 0, teUnlocked = false;

/* Fire TV / mobile browsers block audio until the first real user gesture.
   Prime a silent element on the first tap or remote button press. */
function teUnlock(){
  if(teUnlocked) return;
  teUnlocked = true;
  try{
    const a = new Audio("data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA");
    a.volume = 0; const p = a.play();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}
["pointerdown","touchstart","keydown","click"].forEach(ev=>
  document.addEventListener(ev, teUnlock, {once:false, passive:true}));

function teClip(text){
  const k = teKey(text);
  if(typeof TE_AUDIO === "undefined" || !TE_AUDIO[k]) return null;
  if(!teCache[k]){
    const a = new Audio("data:audio/mpeg;base64," + TE_AUDIO[k]);
    a.preload = "auto";
    teCache[k] = a;
  }
  return teCache[k];
}
function teStop(){
  teToken++;
  Object.keys(teCache).forEach(k=>{
    const a = teCache[k];
    try{ if(!a.paused){ a.pause(); a.currentTime = 0; } }catch(e){}
  });
}
/* Plays a list of Telugu clips back to back with a real pause between them,
   the way a teacher separates a letter from its word. */
function tePlaySeq(list, gaps, done){
  teStop();
  const my = teToken;
  let i = 0;
  (function next(){
    if(my !== teToken) return;
    if(i >= list.length){ if(done) done(); return; }
    const a = teClip(list[i]);
    const gap = (typeof gaps === "function") ? gaps(i) : (gaps || 220);
    i++;
    if(!a){ next(); return; }
    try{ a.currentTime = 0; }catch(e){}
    a.onended = ()=>{ if(my === teToken) setTimeout(next, gap); };
    const p = a.play();
    if(p && p.catch) p.catch(()=>{ if(my === teToken) setTimeout(next, gap); });
  })();
}
function tePlay(text, done){ tePlaySeq([text], 0, done); }

/* ---------------- Speech helpers ---------------- */
/* Routed by SCRIPT, not by subject: English praise stays in the English voice
   even while the Telugu subject is open, and Telugu text never reaches an
   English voice. */
function applyVoice(u, text){
  if(hasTelugu(text)){
    if(selectedTeluguVoice){ u.voice = selectedTeluguVoice; u.lang = selectedTeluguVoice.lang; }
    else{ u.lang = "te-IN"; }
  }else{
    if(selectedVoice){ u.voice = selectedVoice; u.lang = selectedVoice.lang; }
    else{ u.lang = "en-IN"; }
  }
}
function speak(text){
  if(text == null) return;
  text = String(text);
  teStop();
  /* Telugu goes to the recorded native voice whenever we have the clip */
  if(hasTelugu(text)){
    const k = teKey(text);
    if(teHas(k)){ tePlay(k); return; }
    const bare = teOnly(text);
    if(teHas(bare)){ tePlay(bare); return; }
    /* no clip and no real Telugu voice — stay silent rather than let an
       English voice mangle it */
    if(!selectedTeluguVoice) return;
  }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    applyVoice(u, text);
    u.rate = 0.72; u.pitch = 1.08;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakSequence(seq, i){
  if(i >= seq.length) return;
  try{
    const u = new SpeechSynthesisUtterance(seq[i]);
    applyVoice(u, seq[i]);
    u.rate = 0.62; u.pitch = 1.08;
    u.onend = ()=> speakSequence(seq, i+1);
    window.speechSynthesis.speak(u);
  }catch(e){}
}
/* Telugu syllable (అక్షరం) split, mirroring the generator that made the clips */
function teAksharas(word){
  const k = teKey(word);
  if(typeof TE_AKSHARAS !== "undefined" && TE_AKSHARAS[k]) return TE_AKSHARAS[k];
  return [k];
}
function soundItOut(text){
  try{ window.speechSynthesis.cancel(); }catch(e){}
  teStop();
  if(hasTelugu(text)){
    const w = teKey(text);
    const parts = teAksharas(w);
    /* one syllable at a time, then the whole word at speed */
    const seq = parts.length > 1 ? parts.concat([w]) : [w];
    tePlaySeq(seq, i => (i === seq.length - 2 ? 420 : 180));
    return;
  }
  const isSentence = state.levelId === 5;
  const words = isSentence ? text.replace(/\./g,"").split(" ") : [text];
  let seq = [];
  words.forEach(w=>{ phonicsChunks(w).forEach(c=> seq.push(chunkSpeech(c))); seq.push(w); });
  if(isSentence) seq.push(text);
  speakSequence(seq, 0);
}
/* Telugu levels 1-4 teach a letter through an example word ("అ ... అమ్మ"),
   which is exactly how it is taught in class. */
function teluguTeach(item){
  const letter = teKey(item.w);
  const word = teOnly(item.e);
  if(word && word !== letter && teHas(word)) tePlaySeq([letter, word, letter], 380);
  else soundItOut(letter);
}
/* speaks an item the "right" way for its subject/level */
function speakItem(item){
  if(!item) return;
  if(state.subject === "math"){ speak(item.say || item.w); return; }
  if(state.subject === "telugu"){ speakTelugu(item); return; }
  speak(item.w);
}
/* Telugu: recorded clip first, then a real Telugu voice, and only then the
   romanised hint so a device with no Telugu voice still says something. */
function speakTelugu(item){
  const w = teKey(item.w);
  if(teHas(w)){ tePlay(w); return; }
  if(selectedTeluguVoice){ speak(w); return; }
  if(item.roman){ speak(item.roman); return; }
  speak(w);
}

/* ---------------- Praise / appreciation system ---------------- */
/* Every correct answer gets a DIFFERENT word of praise: the list is drawn
   from a shuffled bag, and the bag never starts with the word we just used. */
const PRAISE_WORDS = ["Wow!","Excellent!","Superb!","Well done!","Fantastic!","Amazing!",
  "Great job!","Brilliant!","Terrific!","You're a star!","Perfect!","Awesome!",
  "Super work!","Bravo!","Champion!","Marvellous!","Outstanding!","You did it!","Clever you!","Spot on!"];
const PRAISE_EMOJI = ["🌟","🎉","👏","🏆","💫","🥳","✨","🎊","🚀","🌈"];
const TRY_AGAIN_TIPS = ["You can do it!","Have another go!","Look again carefully.","Take your time.",
  "Nearly there!","Give it one more try.","Think it through again.","Keep going!","Try once more!"];

function bagPick(bagName, list){
  bags[bagName] = bags[bagName] || {items:[], last:null};
  const b = bags[bagName];
  if(b.items.length === 0){
    b.items = shuffleArr(list);
    if(b.items.length > 1 && b.items[0] === b.last){
      const t = b.items[0]; b.items[0] = b.items[1]; b.items[1] = t;
    }
  }
  b.last = b.items.shift();
  return b.last;
}
let bags = {};
function nextPraise(){ return bagPick("praise", PRAISE_WORDS); }
function nextPraiseEmoji(){ return bagPick("praiseEmoji", PRAISE_EMOJI); }
function nextTip(){ return bagPick("tip", TRY_AGAIN_TIPS); }

function popPraise(text){
  const el = document.createElement("div");
  el.className = "praise-pop";
  el.textContent = text;
  document.body.appendChild(el);

}
function popWrong(){
  const el = document.createElement("div");
  el.className = "praise-pop wrong-pop";

  document.body.appendChild(el);

}
/* One place for EVERY wrong answer in the app: a red ✖, the words
   "Wrong answer - try again!", a changing encouragement, and the same
   spoken line so the child always hears the same clear message. */
function showWrong(fb, extra){
  popWrong();
  if(fb){
    fb.className = "feedback bad shake";
    fb.innerHTML = `<span class="mark-x">✖</span> Wrong answer — try again! `
      + `<span style="font-weight:700;">${nextTip()}</span>`
      + (extra ? ` <span style="font-weight:700;">${extra}</span>` : "");
    setTimeout(()=>{ const f=document.getElementById("fb"); if(f) f.classList.remove("shake"); }, 520);
  }
  speak("Wrong answer. Try again.");
}

  }
  persistStats();

  const msg = nextPraise();
  popPraise(msg + " " + nextPraiseEmoji());
  speak(msg);
  return msg;
}

/* ---------------- App state ---------------- */
let state = {
  screen: "name",
  userName: null, avatar: AVATARS[0], pendingAvatar: AVATARS[0], pendingName: "",
  subject: "english",
  levelId: null, idx: 0, order: [], stars: 0,
  stats: blankStats(), batchIndex: {}, doneInfo: null
};

/* ---------------- No-repeat round engine ----------------
   Every game draws from a shuffled "deck" of its own items instead of
   picking at random, so nothing can appear twice in a row — or twice at
   all — until the whole set has been used. When a deck runs out the game
   shows the Round Complete window. */
let decks = {};
function deckSig(items){ return state.subject + "|" + state.levelId + "|" + (state.batchIndex[state.levelId]||0) + "|" + items.length; }
function deckFor(name, items){
  const sig = deckSig(items);
  let d = decks[name];
  if(!d || d.sig !== sig){
    d = decks[name] = {sig:sig, order: shuffleArr(items.map((_,i)=>i)), i:0, last:-1};
  }
  return d;
}
/* finite draw — returns null once every item has been used */
function deckTake(name, items){
  if(!items || items.length === 0) return null;
  const d = deckFor(name, items);
  if(d.i >= d.order.length) return null;
  const idx = d.order[d.i++];
  d.last = idx;
  return items[idx];
}
/* endless draw (Speed Race) — reshuffles but never repeats back to back */
function deckCycle(name, items){
  if(!items || items.length === 0) return null;
  const d = deckFor(name, items);
  if(d.i >= d.order.length){
    d.order = shuffleArr(d.order); d.i = 0;
    if(d.order.length > 1 && d.order[0] === d.last){
      const t = d.order[0]; d.order[0] = d.order[1]; d.order[1] = t;
    }
  }
  const idx = d.order[d.i++];
  d.last = idx;
  return items[idx];
}
function deckTotal(name){ const d = decks[name]; return d ? d.order.length : 0; }
function deckReset(name){ delete decks[name]; }
function resetDecks(){ decks = {}; }

/* ---------------- Round Complete window ---------------- */
function finishRound(label, count, back, home){
  stopSpeedTimer();
  state.doneInfo = {label:label, count:count, back:back, home:home};
  state.screen = "done";
  confettiBurst();
  popPraise("Round complete! 🎉");
  speak("Round complete. Well done!");
  render();
}
function renderDone(){
  const d = state.doneInfo || {label:"Round", count:0, back:"menu", home:"menu"};
  const isGame = d.home === "games";
  return `
  <div class="card">
    <div class="round-done">

      </div>

        <button class="btn btn-grey small" onclick="backFromDone()">← Back to ${isGame ? "games" : "activities"}</button>
      </div>
    </div>
  </div>`;
}
function practiceAgain(){
  const d = state.doneInfo || {};
  resetDecks();
  state.idx = 0; newOrder();
  state.screen = d.back || "menu";
  render();
}
function tryNewSet(){
  const d = state.doneInfo || {};
  advanceBatch();
  resetDecks();
  state.idx = 0; newOrder();
  state.screen = d.back || "menu";
  render();
}
function backFromDone(){
  const d = state.doneInfo || {};
  stopSpeedTimer();
  state.screen = d.home || "menu";
  render();
}
function escapeHtml(t){
  return String(t == null ? "" : t).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function shuffledIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function shuffleArr(a){ const c=[...a]; for(let i=c.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [c[i],c[j]]=[c[j],c[i]]; } return c; }

function currentLevels(){
  if(state.subject==="math") return MATH_LEVELS;
  if(state.subject==="telugu") return TELUGU_LEVELS;
  return AGE_GROUPS;
}
function levelInfo(){ return currentLevels().find(l=>l.id===state.levelId); }
function batchCount(lvl){
  if(state.subject==="math") return MATH_SETS[lvl].length;
  if(state.subject==="telugu") return TELUGU_SETS[lvl].length;
  return WORD_SETS[lvl].length;
}
function currentWords(){
  const lvl = state.levelId;
  if(state.subject==="math") return mathItemsFor(lvl, state.batchIndex[lvl]||0);
  if(state.subject==="telugu") return TELUGU_SETS[lvl][state.batchIndex[lvl]||0];
  return WORD_SETS[lvl][state.batchIndex[lvl]||0];
}
/* Games need short, tidy cards, so every subject exposes a compact pool:
   maths uses each item's gw/ge pair, Telugu drops the picture-and-hint
   block down to a single emoji, English sentences fall back to words. */
function gamePool(){
  if(state.subject === "math"){
    return currentWords().map(it=>({w: it.gw || it.w, e: it.ge || it.e, say: it.say}));
  }
  if(state.subject === "telugu"){
    return currentWords().map(it=>({w: it.w, e: it.emoji || it.e, roman: it.roman}));
  }
  return state.levelId === 5 ? WORD_SETS[4][state.batchIndex[4]||0] : currentWords();
}
function normalize(s){ return s.trim().toLowerCase().replace(/[.\s]+/g,' ').replace(/\.$/,'').trim(); }
function newOrder(){ state.order = shuffledIndices(currentWords().length); }
function curItem(){
  if(!state.order || state.order.length !== currentWords().length) newOrder();
  return currentWords()[state.order[state.idx]];
}
function advanceBatch(){
  const lvl = state.levelId;
  const total = batchCount(lvl) || 1;
  state.batchIndex[lvl] = ((state.batchIndex[lvl] || 0) + 1) % total;
  resetDecks();
}
function newWordSet(){
  advanceBatch();
  state.idx = 0;
  newOrder();
  const isMath = state.subject==="math", isTelugu = state.subject==="telugu";
  popPraise(isMath ? "New numbers loaded! 🔢" : (isTelugu ? "New letters loaded! 🔤" : "New words loaded! 📚"));
  speak(isMath ? "New numbers loaded" : "New set loaded");
  render();
}

function confettiBurst(){
  const colors = ["#FFC93C","#4FC3F7","#66BB6A","#FF6F91","#8B5CF6"];
  for(let i=0;i<26;i++){
    const p = document.createElement("div");
    p.className = "confetti-piece";
    p.style.left = Math.random()*100 + "vw";
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (1.6 + Math.random()*1.2) + "s";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 3000);
  }
}

/* ---- Listen & Choose: the LISTENING skill ----------------------------
   Nothing is written on screen until the child has answered, so the only
   way through is to listen. Works for all three subjects: English hears a
   word and taps the picture, Maths hears a number and taps the quantity,
   Telugu hears a letter/word and taps the matching one. */
let listenItem = null, listenOpts = [], listenPlayed = false, listenLocked = false;
function buildListenRound(){
  const pool = gamePool();
  const item = curItem();
  listenItem = {w:item.w, e:(item.ge || item.emoji || item.e), say:item.say, roman:item.roman};
  const others = shuffleArr(pool.filter(o=>o.w !== item.w)).slice(0, 2);
  listenOpts = shuffleArr([listenItem, ...others.map(o=>({w:o.w, e:o.e}))]);
  listenPlayed = false; listenLocked = false;
}
function playListen(){
  listenPlayed = true;
  if(state.subject === "telugu") speakTelugu(listenItem);
  else speak(listenItem.say || listenItem.w);
  const h = document.getElementById("listenHint");
  if(h) h.textContent = "Now tap what you heard 👇";
}
function renderListen(){
  buildListenRound();
  const isMath = state.subject==="math";
  return `
  <div class="card stage">
    ${activityHeader()}
    ${progressBar()}
    ${hootMsg("listen")}
    <div class="listen-big">👂</div>
    <div class="listen-hint" id="listenHint">Tap the speaker and listen carefully</div>
    <div class="btn-row" style="margin-bottom:8px;">
      <button class="btn btn-blue" onclick="playListen()">🔊 Listen</button>
      <button class="btn btn-purple small" onclick="playListen()">🔁 Again</button>
    </div>
    <div class="quiz-options" id="listenOpts"></div>
    <div class="feedback" id="fb"></div>
    <div class="btn-row" style="margin-top:14px;"><button class="btn btn-grey small" onclick="advance()">Skip ➡️</button></div>
  </div>`;
}
function paintListen(){
  const opts = document.getElementById("listenOpts");
  if(opts){
    opts.innerHTML = listenOpts.map(o=>
      `<div class="quiz-opt" onclick="answerListen('${String(o.w).replace(/'/g,"\\'")}')">${o.e}</div>`).join("");
  }
  const fb = document.getElementById("fb"); if(fb){ fb.className="feedback"; fb.textContent=""; }
  /* say it once automatically so a young child never gets stuck */
  setTimeout(()=>{ if(state.screen === "listen") playListen(); }, 450);
}
function answerListen(chosen){
  if(listenLocked) return;
  const fb = document.getElementById("fb");
  if(!listenPlayed){ fb.className="feedback bad"; fb.textContent="Tap 🔊 Listen first, then choose!"; return; }
  if(chosen === listenItem.w){
    listenLocked = true;
    const msg = celebrateCorrect(1);
    fb.className = "feedback good";
    fb.innerHTML = `${msg} You heard <b>${escapeHtml(listenItem.w)}</b> — correct!`;
    setTimeout(advance, 1200);
  }else{
    showWrong(fb, "Tap 🔁 Again and listen once more.");
  }
}

function startListening(){
  const item = curItem();
  const fb = document.getElementById("fb");
  const btn = document.getElementById("micBtn");
  const rec = getRecognition();
  if(!rec){ fb.textContent = "Speech recognition isn't available in this browser."; return; }
  fb.className = "feedback"; fb.textContent = "🎧 Listening... say it now!";
  if(btn){ btn.disabled = true; btn.textContent = "🎙️ Listening..."; btn.classList.add("mic-listening"); }
  rec.onresult = (event)=>{
    const said = event.results[0][0].transcript;
    let okMatch = normalize(said).includes(normalize(item.w)) || normalize(item.w).includes(normalize(said));
    if(!okMatch && state.subject==="math"){
      const n = parseInt(item.w, 10);
      if(!isNaN(n) && NUMBER_WORDS[n]){ okMatch = normalize(said).includes(NUMBER_WORDS[n]); }
    }
    if(okMatch){
      const msg = celebrateCorrect(1);
      fb.className = "feedback good"; fb.textContent = `${msg} I heard: "${said}" — that's right!`;
      setTimeout(()=>advance(), 1100);
    }else{
      showWrong(fb, `I heard: "${escapeHtml(said)}"`);
    }
    resetMicBtn(btn);
  };
  rec.onerror = ()=>{ fb.className = "feedback bad"; fb.textContent = "Hmm, I couldn't hear you clearly — tap the mic and try again!"; resetMicBtn(btn); };
  rec.onend = ()=> resetMicBtn(btn);
  try{ rec.start(); }catch(e){ resetMicBtn(btn); }
}

/* ============================================================
   GAMES
   Every game draws from a no-repeat deck (see deckTake) so an item can
   never appear twice in a row, and when the deck is empty the shared
   Round Complete window offers "Practise Again" or "Try a New Set".
   ============================================================ */

/* ---- Memory / Number / Letter Match game ---- */
let memCards=[], memFlipped=[], memMatched=0, memPairs=0, memBusy=false;
function buildMemoryDeck(){
  const words = gamePool();
  const pickCount = Math.min(6, words.length);
  const idxs = shuffledIndices(words.length).slice(0,pickCount);
  let deck = [];
  idxs.forEach((wi,i)=>{ deck.push({key:i,type:'word',text:words[wi].w}); deck.push({key:i,type:'emoji',text:words[wi].e}); });
  deck = shuffleArr(deck);
  memCards = deck.map((c,pos)=>({...c,pos,flipped:false,matched:false}));
  memFlipped = []; memMatched = 0; memPairs = pickCount; memBusy = false;
}
function renderMemoryShell(){
  buildMemoryDeck();
  const isMath = state.subject==="math", isTelugu = state.subject==="telugu";
  const title = isMath ? "Number Match" : (isTelugu ? "Letter Match" : "Memory Match");
  return `
  <div class="card">
    <button class="back-link" onclick="state.screen='games';render();">← Back to games</button>
    <h2 class="screen-title">🧠 ${title}</h2>
    <p class="screen-sub">Find all ${memPairs} matching pairs</p>
    <div class="memory-grid" id="memGrid"></div>
    <div class="feedback" id="fb"></div>
    <div class="btn-row" style="margin-top:16px;"><button class="btn btn-yellow small" onclick="buildMemoryDeck();paintMemory();">🔄 Shuffle</button></div>
  </div>`;
}
function paintMemory(){
  const grid = document.getElementById("memGrid"); if(!grid) return;
  grid.innerHTML = memCards.map(c=>{
    const cls = "mem-card" + (c.matched?" matched":(c.flipped?" flipped":""));
    const content = (c.flipped||c.matched) ? c.text : "❓";
    return `<div class="${cls}" data-pos="${c.pos}" onclick="flipMemCard(${c.pos})">${content}</div>`;
  }).join("");
}
function flipMemCard(pos){
  const card = memCards.find(c=>c.pos===pos);
  if(!card || card.flipped || card.matched || memBusy) return;
  card.flipped = true; memFlipped.push(card); paintMemory();
  if(memFlipped.length===2){
    const [a,b] = memFlipped;
    if(a.key===b.key && a.type!==b.type){
      a.matched=true; b.matched=true; memMatched++; memFlipped=[]; paintMemory();
      celebrateCorrect(1);
      if(memMatched >= memPairs){
        setTimeout(()=>finishRound("Memory Match", memPairs, "mem", "games"), 900);
      }
    }else{
      memBusy = true;
      showWrong(document.getElementById("fb"), "Those two don't go together.");
      setTimeout(()=>{ a.flipped=false; b.flipped=false; memFlipped=[]; memBusy=false; paintMemory();
        const f=document.getElementById("fb"); if(f){ f.className="feedback"; f.textContent=""; } },900);
    }
  }
}

/* ---- Word / Sentence / Number / Letter Order Builder ---- */
let buildTarget="", buildTokens=[], buildTileState=[], buildSlots=[], buildEmoji="", buildWholeSet=false;
function pickBuildTarget(){
  if(state.subject==="math"){
    const items = gamePool();
    const numeric = items.every(it=>!isNaN(parseInt(it.w,10)));
    const ordered = numeric ? [...items].map(it=>it.w).sort((a,b)=>parseInt(a,10)-parseInt(b,10))
                            : items.map(it=>it.w);
    buildTarget = ordered.join(" ");
    buildTokens = ordered.slice();
    buildTileState = shuffleArr(buildTokens).map((t,i)=>({text:t,used:false,id:i}));
    buildSlots = []; buildWholeSet = true;
    return numeric ? "🔢" : "🔷";
  }
  if(state.subject==="telugu"){
    const items = currentWords();
    const ordered = items.map(it=>it.w);
    buildTarget = ordered.join(" ");
    buildTokens = ordered.slice();
    buildTileState = shuffleArr(buildTokens).map((t,i)=>({text:t,used:false,id:i}));
    buildSlots = []; buildWholeSet = true;
    return "🔤";
  }
  const item = deckTake("build", currentWords());
  if(!item) return null;
  buildTarget = item.w;
  buildTokens = state.levelId===5 ? item.w.replace(/\./,'').split(" ") : item.w.split("");
  buildTileState = shuffleArr(buildTokens).map((t,i)=>({text:t,used:false,id:i}));
  buildSlots = []; buildWholeSet = false;
  return item.e;
}
function buildTitle(){
  const isMath = state.subject==="math", isTelugu = state.subject==="telugu";
  return isMath ? (state.levelId===11?'Pattern Order':'Number Order')
                : (isTelugu ? 'Letter Order' : (state.levelId===5?'Sentence Builder':'Word Builder'));
}
function renderBuildShell(){
  deckReset("build");
  buildEmoji = pickBuildTarget();
  const isMath = state.subject==="math", isTelugu = state.subject==="telugu", isEnglish = state.subject==="english";
  const instructions = isMath ? (state.levelId===11 ? 'Arrange the shapes in the pattern order!' : 'Arrange the numbers from smallest to biggest!')
                     : (isTelugu ? 'Arrange them in the right order!' : '');
  return `
  <div class="card stage">

function paintBuild(reroll){

  }

      return `<div class="slot ${filled?'filled':''}" style="${spaceJoin?'min-width:70px;':''}">${filled?filled.text:''}</div>`;
    }).join("");
  }
  if(tileRow){
    tileRow.innerHTML = buildTileState.map(t=>
      `<div class="tile ${spaceJoin?'word-tile':''} ${t.used?'used':''}" onclick="pickTile(${t.id})">${t.text}</div>`

function pickTile(id){
  const tile = buildTileState.find(t=>t.id===id);
  if(!tile || tile.used) return;
  if(buildSlots.length >= buildTokens.length) return;
  tile.used = true; buildSlots.push({text:tile.text, tileId:id});
  paintBuild(false);
}
function clearBuild(){ buildTileState.forEach(t=>t.used=false); buildSlots=[]; paintBuild(false); }
function checkBuild(){
  const fb = document.getElementById("fb");
  const spaceJoin = buildWholeSet || state.levelId===5;
  const attempt = buildSlots.map(s=>s.text).join(spaceJoin?" ":"");
  if(buildSlots.length !== buildTokens.length){ fb.className="feedback bad"; fb.textContent="Fill all the spaces first!"; return; }
  if(normalize(attempt) === normalize(buildTarget)){
    const msg = celebrateCorrect(2);
    fb.className="feedback good"; fb.textContent=msg+" You built it!";
    if(buildWholeSet){ setTimeout(()=>finishRound(buildTitle(), buildTokens.length, "build", "games"), 1100); }
    else setTimeout(()=>paintBuild(true), 1100);
  }else{
    showWrong(fb, "Check the order.");
  }
}

/* ---- Rhyme Match (English) / Vowel Friends (Telugu) ---- */
let rhymeCards=[], rhymeSelected=[], rhymeMatched=0, rhymePairs=0;
function rhymeRounds(){
  if(state.subject==="telugu") return [TELUGU_VOWEL_PAIRS];
  return RHYME_SETS[state.levelId===5?4:state.levelId] || RHYME_SETS[2];
}
function buildRhymeRound(){
  const sets = deckTake("rhyme", rhymeRounds());
  if(!sets) return false;
  let cards = [];
  sets.forEach((pair,i)=>{ cards.push({pairId:i,w:pair[0],e:pair[1]}); cards.push({pairId:i,w:pair[2],e:pair[3]}); });
  cards = shuffleArr(cards);
  rhymeCards = cards.map((c,pos)=>({...c,pos,selected:false,matched:false}));
  rhymeSelected = []; rhymeMatched = 0; rhymePairs = sets.length;
  return true;
}
function rhymeTitle(){ return state.subject==="telugu" ? "Vowel Friends" : "Rhyme Match"; }
function renderRhymeShell(){
  deckReset("rhyme"); buildRhymeRound();
  return `
  <div class="card">
    <button class="back-link" onclick="state.screen='games';render();">← Back to games</button>
    ${hootMsg("rhyme")}
    <h2 class="screen-title">${state.subject==="telugu"?'🔤':'🎵'} ${rhymeTitle()}</h2>
    <div class="rhyme-grid" id="rhymeGrid"></div>
    <div class="feedback" id="fb"></div>
    <div class="btn-row" style="margin-top:16px;"><button class="btn btn-yellow small" onclick="nextRhyme()">🔄 Next Round</button></div>
  </div>`;
}
function nextRhyme(){
  if(!buildRhymeRound()){ finishRound(rhymeTitle(), deckTotal("rhyme"), "rhyme", "games"); return; }
  paintRhyme();
}
function paintRhyme(){
  const grid = document.getElementById("rhymeGrid"); if(!grid) return;
  grid.innerHTML = rhymeCards.map(c=>{
    const cls = "rhyme-card" + (c.matched?" matched":(c.selected?" selected":""));
    return `<div class="${cls}" data-pos="${c.pos}" onclick="pickRhyme(${c.pos})"><span class="re">${c.e}</span><span class="rw">${c.w}</span></div>`;
  }).join("");
}
function pickRhyme(pos){
  const card = rhymeCards.find(c=>c.pos===pos);
  if(!card || card.matched || card.selected || rhymeSelected.length===2) return;
  card.selected = true; rhymeSelected.push(card);
  speak(card.w);
  paintRhyme();
  const fb = document.getElementById("fb");
  const isTelugu = state.subject==="telugu";
  if(rhymeSelected.length===2){
    const [a,b] = rhymeSelected;
    if(a.pairId===b.pairId){
      a.matched=true; b.matched=true; rhymeMatched++;
      const msg = celebrateCorrect(1);
      fb.className="feedback good"; fb.textContent=msg+(isTelugu?" Vowel friends!":" They rhyme!");
      rhymeSelected=[]; paintRhyme();
      if(rhymeMatched >= rhymePairs) setTimeout(nextRhyme, 1000);
    }else{
      showWrong(fb);
      setTimeout(()=>{ a.selected=false; b.selected=false; rhymeSelected=[]; paintRhyme();
        const f=document.getElementById("fb"); if(f){ f.className="feedback"; f.textContent=""; } },900);
    }
  }else if(fb){ fb.className="feedback"; fb.textContent=""; }
}

/* ---- Missing Letter / Missing Number ---- */
let missTarget=null, missAnswer="", missOptions=[], lastMissAnswer="";
/* The word/number run already comes from a no-repeat deck, but the blanked
   position is chosen inside it — so we also make sure the ANSWER itself is
   never the same two turns running. */
function pickBlank(values){
  const fresh = values.map((v,i)=>i).filter(i=>String(values[i]) !== lastMissAnswer);
  const pool = fresh.length ? fresh : values.map((v,i)=>i);
  return pool[Math.floor(Math.random()*pool.length)];
}
function buildMissingRound(){
  if(state.subject==="math"){
    if(state.levelId===11){
      const items = gamePool();
      const a = items[0], b = items[1];
      const seq = [a,b,a,b,a];
      const spot = deckTake("miss", [0,1,2,3,4]);
      if(spot === null) return false;
      missAnswer = seq[spot].w; lastMissAnswer = missAnswer;
      missTarget = { e:"🔷", display: seq.map((it,i)=> i===spot ? '<span class="blank-slot">❓</span>' : it.e).join(" ") };
      const distract = shuffleArr(items.map(it=>it.w).filter(w=>w!==missAnswer)).slice(0,3);
      missOptions = shuffleArr([missAnswer, ...distract]);
      return true;
    }
    /* counting 0-20 is the backbone of every maths page, so the missing
       number always sits in a run of five consecutive numbers */
    const start = deckTake("miss", [0,2,4,6,8,10,12,14,16]);
    if(start === null) return false;
    const seq = [start, start+1, start+2, start+3, start+4];
    const bi = pickBlank(seq);
    missAnswer = String(seq[bi]); lastMissAnswer = missAnswer;
    missTarget = { e:"🔢", display: seq.map((n,i)=> i===bi ? '<span class="blank-slot">__</span>' : n).join(",  ") };
    let distractors=[];
    while(distractors.length<3){
      const d = seq[bi] + (Math.floor(Math.random()*7)-3);
      if(d>=0 && d<=20 && d!==seq[bi] && !distractors.includes(String(d))) distractors.push(String(d));
    }
    missOptions = shuffleArr([missAnswer, ...distractors]);
    return true;
  }
  if(state.subject==="telugu"){
    const items = currentWords();
    const pick = deckTake("miss", items);
    if(!pick) return false;
    missAnswer = pick.w; lastMissAnswer = missAnswer;
    missTarget = { e:"🔤", display: items.map(it=> it.w===pick.w ? '<span class="blank-slot">❓</span>' : it.w).join("   ") };
    const distract = shuffleArr(items.map(it=>it.w).filter(w=>w!==missAnswer)).slice(0,3);
    missOptions = shuffleArr([missAnswer, ...distract]);
    return true;
  }
  const words = currentWords();
  const item = deckTake("miss", words);
  if(!item) return false;
  missTarget = {...item};
  if(state.levelId===5){
    const tokens = item.w.replace(/\./,"").split(" ");
    const bi = pickBlank(tokens);
    missAnswer = tokens[bi]; lastMissAnswer = missAnswer;
    missTarget.display = tokens.map((t,i)=> i===bi ? '<span class="blank-slot">_____</span>' : t).join(" ") + (item.w.trim().endsWith(".") ? "." : "");
    const pool = new Set();
    words.forEach(w=> w.w.replace(/\./,"").split(" ").forEach(tk=> pool.add(tk)));
    pool.delete(missAnswer);
    missOptions = shuffleArr([missAnswer, ...shuffleArr([...pool]).slice(0,3)]);
  }else{
    const letters = item.w.split("");
    const bi = pickBlank(letters);
    missAnswer = letters[bi]; lastMissAnswer = missAnswer;
    missTarget.display = letters.map((l,i)=> i===bi ? '<span class="blank-slot">_</span>' : l).join("");
    const alphabet = "abcdefghijklmnopqrstuvwxyz".split("").filter(c=>c!==missAnswer);
    missOptions = shuffleArr([missAnswer, ...shuffleArr(alphabet).slice(0,3)]);
  }
  return true;
}
function missTitle(){ return state.subject==="math" ? "Missing Number" : "Missing Letter"; }
function renderMissShell(){
  deckReset("miss"); buildMissingRound();
  return `
  <div class="card stage">
    <button class="back-link" onclick="state.screen='games';render();">← Back to games</button>
    ${hootMsg("miss")}
    <h2 class="screen-title">🧩 ${missTitle()}</h2>
    <div class="word-emoji" id="missEmoji">${missTarget.e}</div>
    <div class="word-big ${(state.subject==='english' && state.levelId===5)?'sentence':''}" id="missWord">${missTarget.display}</div>
    <div class="btn-row" style="margin-bottom:12px;"><button class="btn btn-blue small" onclick="speak(missAnswer)">🔊 Hear the answer sound</button></div>
    <div class="quiz-options" id="missOpts"></div>
    <div class="feedback" id="fb"></div>
    <div class="btn-row" style="margin-top:16px;"><button class="btn btn-yellow small" onclick="nextMiss()">🔄 Skip</button></div>
  </div>`;
}
function nextMiss(){
  if(!buildMissingRound()){ finishRound(missTitle(), deckTotal("miss"), "miss", "games"); return; }
  paintMiss();
}
function paintMiss(){
  const w = document.getElementById("missWord"); if(w) w.innerHTML = missTarget.display;
  const opts = document.getElementById("missOpts");
  if(opts) opts.innerHTML = missOptions.map(o=>`<div class="quiz-opt word-opt" onclick="answerMiss('${String(o).replace(/'/g,"\\'")}')">${o}</div>`).join("");
  const emojiEl = document.getElementById("missEmoji"); if(emojiEl) emojiEl.innerHTML = missTarget.e;
  const fb = document.getElementById("fb"); if(fb){ fb.className="feedback"; fb.textContent=""; }
}
function answerMiss(opt){
  const fb = document.getElementById("fb");
  if(opt === missAnswer){
    const msg = celebrateCorrect(1);
    fb.className="feedback good"; fb.textContent=msg+" Correct!";
    setTimeout(nextMiss, 1000);
  }else{
    showWrong(fb);
  }
}

/* ---- Listen & Check ---- */
let checkItem=null, checkSpoken="", checkIsMatch=true, checkPlayed=false, checkSpeaking=false;
function buildCheckRound(){
  const words = gamePool();
  const pick = deckTake("check", words);
  if(!pick) return false;
  checkItem = pick;
  checkIsMatch = Math.random() < 0.5;
  if(checkIsMatch){ checkSpoken = checkItem.w; }
  else{
    const others = words.filter(w=>w.w !== checkItem.w);
    checkSpoken = others.length ? others[Math.floor(Math.random()*others.length)].w : checkItem.w;
    if(checkSpoken === checkItem.w) checkIsMatch = true;
  }
  checkPlayed = false;
  return true;
}
function renderCheckShell(){
  deckReset("check"); buildCheckRound();
  const isMath = state.subject==="math";
  return `
  <div class="card stage">
    <button class="back-link" onclick="state.screen='games';render();">← Back to games</button>

    <div class="btn-row">
      <button class="btn btn-green" onclick="answerCheck(true)">✅ It Matches</button>
      <button class="btn btn-pink" onclick="answerCheck(false)">❌ No Match</button>
    </div>
    <div class="feedback" id="fb"></div>
    <div class="btn-row" style="margin-top:16px;"><button class="btn btn-yellow small" onclick="nextCheck()">🔄 Skip</button></div>
  </div>`;
}
function nextCheck(){
  if(!buildCheckRound()){ finishRound("Listen & Check", deckTotal("check"), "check", "games"); return; }
  paintCheck();
}
function paintCheck(){
  const el = document.getElementById("checkVisual"); if(el) el.innerHTML = checkItem.e;
  const fb = document.getElementById("fb"); if(fb){ fb.className="feedback"; fb.textContent=""; }
}
function playCheckSound(){
  if(checkSpeaking) return;
  checkSpeaking = true;
  const btn = document.getElementById("playSoundBtn");
  if(btn) btn.disabled = true;
  const release = ()=>{ checkSpeaking = false; if(btn) btn.disabled = false; };
  if(hasTelugu(checkSpoken) && teHas(checkSpoken)){
    tePlay(teKey(checkSpoken), release);
    checkPlayed = true;
    return;
  }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(checkSpoken);
    applyVoice(u, checkSpoken);
    u.rate = 0.6; u.pitch = 1.08;
    u.onend = release; u.onerror = release;
    window.speechSynthesis.speak(u);
  }catch(e){ release(); }
  checkPlayed = true;
}
function answerCheck(said){
  const fb = document.getElementById("fb");
  if(!checkPlayed){ fb.className="feedback bad"; fb.textContent="Tap 'Play Sound' first and listen!"; return; }
  if(said === checkIsMatch){
    const msg = celebrateCorrect(1);
    fb.className="feedback good"; fb.textContent=msg+" Great listening!";
    setTimeout(nextCheck, 1000);
  }else{
    showWrong(fb, `I said "${escapeHtml(checkSpoken)}".`);
  }
}

/* ---- Equation Builder (Maths) ---- */
let eqTarget="", eqTokens=[], eqTileState=[], eqSlots=[];
function pickEquationTarget(){
  const fact = deckTake("equation", MATH_FACTS);
  if(!fact) return false;
  const ans = fact.op==="+" ? fact.a+fact.b : fact.a-fact.b;
  eqTokens = [String(fact.a), fact.op==="+"?"+":"−", String(fact.b), "=", String(ans)];
  eqTileState = shuffleArr(eqTokens).map((t,i)=>({text:t,used:false,id:i}));
  eqSlots = [];
  eqTarget = eqTokens.join(" ");
  return true;
}
function renderEquationShell(){
  deckReset("equation"); pickEquationTarget();
  return `
  <div class="card stage">
    <button class="back-link" onclick="state.screen='games';render();">← Back to games</button>
    ${hootMsg("eq")}
    <h2 class="screen-title">➕ Number Sentence Builder</h2>
    <p class="screen-sub">Put the numbers and signs in the right order</p>
    <div class="btn-row" style="margin-bottom:10px;"><button class="btn btn-blue small" onclick="speak(eqTarget.replace('−',' minus ').replace('+',' plus ').replace('=',' equals '))">🔊 Hear it</button></div>
    <div class="slot-row" id="eqSlotRow"></div>
    <div class="tile-row" id="eqTileRow"></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-grey small" onclick="clearEquation()">Clear</button>
      <button class="btn btn-green small" onclick="checkEquation()">Check ✔️</button>
      <button class="btn btn-yellow small" onclick="nextEquation()">🔄 Skip</button>
    </div>
    <div class="feedback" id="fb"></div>
  </div>`;
}
function nextEquation(){
  if(!pickEquationTarget()){ finishRound("Number Sentence Builder", deckTotal("equation"), "equation", "games"); return; }
  paintEquation(false);
}
function paintEquation(){
  const slotRow = document.getElementById("eqSlotRow");
  const tileRow = document.getElementById("eqTileRow");
  if(slotRow){
    slotRow.innerHTML = eqTokens.map((_,i)=>{
      const filled = eqSlots[i];
      return `<div class="slot" style="min-width:56px;${filled?'border-style:solid;background:#EAF7FF;border-color:var(--sky);':''}">${filled?filled.text:''}</div>`;
    }).join("");
  }
  if(tileRow){
    tileRow.innerHTML = eqTileState.map(t=>
      `<div class="tile ${t.used?'used':''}" onclick="pickEqTile(${t.id})">${t.text}</div>`
    ).join("");
  }
  const fb = document.getElementById("fb"); if(fb){ fb.className="feedback"; fb.textContent=""; }
}
function pickEqTile(id){
  const tile = eqTileState.find(t=>t.id===id);
  if(!tile || tile.used) return;
  if(eqSlots.length >= eqTokens.length) return;
  tile.used = true; eqSlots.push({text:tile.text, tileId:id});
  paintEquation();
}
function clearEquation(){ eqTileState.forEach(t=>t.used=false); eqSlots=[]; paintEquation(); }
function checkEquation(){
  const fb = document.getElementById("fb");
  const attempt = eqSlots.map(s=>s.text).join(" ");
  if(eqSlots.length !== eqTokens.length){ fb.className="feedback bad"; fb.textContent="Fill all the spaces first!"; return; }
  if(attempt === eqTarget){
    const msg = celebrateCorrect(2);
    fb.className="feedback good"; fb.textContent=msg+" Number sentence complete!";
    setTimeout(nextEquation, 1100);
  }else{
    showWrong(fb, "Check the order of the numbers and signs.");
  }
}

/* ---- Number Line Hop (Maths — counting back / subtraction) ---- */
let hopRound=null, hopLocked=false;
function newHop(){
  const r = deckTake("hop", HOP_ROUNDS);
  if(!r) return false;
  hopRound = {s:r.s, b:r.b, ans:r.s - r.b, picked:null};
  hopLocked = false;
  return true;
}
function renderHopShell(){
  deckReset("hop"); newHop();
  return `
  <div class="card stage">
    <button class="back-link" onclick="state.screen='games';render();">← Back to games</button>
    ${hootMsg("hop")}
    <h2 class="screen-title">⏪ Number Line Hop</h2>
    <div id="hopBody"></div>
    <div class="feedback" id="fb"></div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-blue small" onclick="speak('Start at ' + hopRound.s + ', count back ' + hopRound.b)">🔊 Hear it</button>
      <button class="btn btn-yellow small" onclick="nextHop()">🔄 Skip</button>
    </div>
  </div>`;
}
function nextHop(){
  if(!newHop()){ finishRound("Number Line Hop", deckTotal("hop"), "hop", "games"); return; }
  paintHop();
}
function paintHop(){
  const body = document.getElementById("hopBody");
  if(!body) return;
  let cells = "";
  for(let n=1;n<=10;n++){
    let cls = "num-cell tappable";
    if(n === hopRound.s) cls += " start";
    if(hopRound.picked === n) cls += (n === hopRound.ans ? " land" : " badpick");
    cells += `<div class="${cls}" onclick="hopPick(${n})">${n}</div>`;
  }
  body.innerHTML = miniQ(`🐢 The turtle sits on <b>${hopRound.s}</b> and counts back <b>${hopRound.b}</b>. Tap the rock it lands on.`)
    + `<div class="num-track">${cells}</div>`;
  const fb = document.getElementById("fb"); if(fb){ fb.className="feedback"; fb.textContent=""; }
}
function hopPick(n){
  if(hopLocked) return;
  hopRound.picked = n;
  paintHop();
  const fb = document.getElementById("fb");
  if(n === hopRound.ans){
    hopLocked = true;
    const msg = celebrateCorrect(2);
    fb.className="feedback good";
    fb.textContent = `${msg} ${hopRound.s} count back ${hopRound.b} lands on ${hopRound.ans}!`;
    setTimeout(nextHop, 1400);
  }else{
    showWrong(fb, "Count back one rock at a time.");
  }
}

/* ---- Coin Shop (Maths — Indian money) ---- */
let shopItem=null, purse=[];
function newShop(){
  const it = deckTake("coins", SHOP_ITEMS);
  if(!it) return false;
  shopItem = it; purse = [];
  return true;
}
function renderCoinShell(){
  deckReset("coins"); newShop();
  return `
  <div class="card stage">
    <button class="back-link" onclick="state.screen='games';render();">← Back to games</button>
    ${hootMsg("coins")}
    <h2 class="screen-title">🪙 Coin Shop</h2>
    <div id="shopBody"></div>
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn btn-grey small" onclick="purseClear()">Empty purse</button>
      <button class="btn btn-green small" onclick="shopCheck()">Pay ✔️</button>
      <button class="btn btn-yellow small" onclick="nextShop()">🔄 Skip</button>
    </div>
    <div class="feedback" id="fb"></div>
  </div>`;
}
function nextShop(){
  if(!newShop()){ finishRound("Coin Shop", deckTotal("coins"), "coins", "games"); return; }
  paintShop();
}
function purseTotal(){ return purse.reduce((s,v)=>s+v,0); }
function paintShop(){
  const body = document.getElementById("shopBody");
  if(!body) return;
  const coins = COIN_VALUES.map(v=>`<div class="coin" onclick="addCoin(${v})">₹${v}</div>`).join("");
  const inPurse = purse.length
    ? purse.map((v,i)=>`<div class="coin small" onclick="dropCoin(${i})">₹${v}</div>`).join("")
    : `<span class="purse-total">Tap coins below to fill the purse</span>`;
  body.innerHTML =
      miniQ(`Buy the ${shopItem.n} — pay the exact price.`)
    + `<div class="obj-row" style="font-size:3.4rem;">${shopItem.e}</div>`
    + `<div class="price-tag">Price: ₹${shopItem.p}</div>`
    + `<div class="purse">${inPurse}</div>`
    + `<div class="purse-total">In the purse: ₹${purseTotal()}</div>`
    + `<div class="coin-row">${coins}</div>`;
  const fb = document.getElementById("fb"); if(fb){ fb.className="feedback"; fb.textContent=""; }
}
function addCoin(v){ if(purse.length < 12){ purse.push(v); speak(v + " rupees"); } paintShop(); }
function dropCoin(i){ purse.splice(i,1); paintShop(); }
function purseClear(){ purse = []; paintShop(); }
function shopCheck(){
  const fb = document.getElementById("fb");
  const t = purseTotal();
  if(t === shopItem.p){
    const msg = celebrateCorrect(2);
    fb.className="feedback good"; fb.textContent = `${msg} ₹${t} is exactly right!`;
    speak(`${t} rupees. Exactly right!`);
    setTimeout(nextShop, 1400);
  }else{
    showWrong(fb, t < shopItem.p ? `You need ₹${shopItem.p - t} more.` : `That is ₹${t - shopItem.p} too much.`);
  }
}

/* ---- గుణింతం Match (Telugu — vowel signs) ---- */
let gunintQ=null, gunintOpts=[];
function newGunint(){
  const pick = deckTake("gunint", TE_SIGNS);
  if(!pick) return false;
  const bases = ["క","మ","ప","త","ర","గ","న","వ"];
  const base = bases[Math.floor(Math.random()*bases.length)];
  const answer = base + pick.sign;
  const wrongSigns = shuffleArr(TE_SIGNS.filter(s=>s.sign !== pick.sign)).slice(0,2);
  gunintQ = {base:base, sign:pick.sign, vowel:pick.vowel, roman:(TE_BASE_ROMAN[base]||"").slice(0,-1) + pick.roman, answer:answer};
  gunintOpts = shuffleArr([answer, ...wrongSigns.map(s=>base + s.sign)]);
  return true;
}
function renderGunintShell(){
  deckReset("gunint"); newGunint();
  return `
  <div class="card stage">
    <button class="back-link" onclick="state.screen='games';render();">← Back to games</button>
    ${hootMsg("gunint")}
    <h2 class="screen-title">🪄 గుణింతం Match</h2>
    <div id="gunintBody"></div>
    <div class="quiz-options" id="gunintOpts"></div>
    <div class="feedback" id="fb"></div>
    <div class="btn-row" style="margin-top:16px;"><button class="btn btn-yellow small" onclick="nextGunint()">🔄 Skip</button></div>
  </div>`;
}
function nextGunint(){
  if(!newGunint()){ finishRound("గుణింతం Match", deckTotal("gunint"), "gunint", "games"); return; }
  paintGunint();
}
function paintGunint(){
  const body = document.getElementById("gunintBody");
  if(body){
    body.innerHTML = miniQ(`Which letter is <b>${gunintQ.base}</b> with <b>${gunintQ.vowel}</b>?`)
      + `<div class="gunint-eq"><span class="te-chip">${gunintQ.base}</span> + <span class="te-chip">${gunintQ.sign || "—"}</span> = <span class="te-chip">?</span></div>`
      + `<span class="roman">${gunintQ.roman}</span>`;
  }
  const opts = document.getElementById("gunintOpts");
  if(opts) opts.innerHTML = gunintOpts.map(o=>`<div class="quiz-opt word-opt te-line" onclick="answerGunint('${o}')">${o}</div>`).join("");
  const fb = document.getElementById("fb"); if(fb){ fb.className="feedback"; fb.textContent=""; }
}
function answerGunint(opt){
  const fb = document.getElementById("fb");
  if(opt === gunintQ.answer){
    const msg = celebrateCorrect(1);
    fb.className="feedback good"; fb.textContent = `${msg} ${gunintQ.base} + ${gunintQ.sign || "—"} = ${gunintQ.answer}`;
    setTimeout(nextGunint, 1200);
  }else{
    showWrong(fb, "Look at the గుర్తు carefully.");
  }
}

/* ---------------- Navigation ---------------- */
function goHome(){ stopSpeedTimer(); state.screen="home"; render(); }
function chooseLevel(id){
  state.levelId=id; state.idx=0; resetDecks(); newOrder(); state.screen="menu"; render();
}
function startMode(mode){ state.idx=0; resetDecks(); newOrder(); state.screen=mode; render(); }
function startGame(game){
  stopSpeedTimer();
  deckReset(game);
  state.stats.gamesPlayed[state.subject] = (state.stats.gamesPlayed[state.subject]||0) + 1;
  persistStats();
  state.screen = game;
  render();
}

function afterRender(){
  if(state.screen==="listen") paintListen();
  if(state.screen==="mem") paintMemory();
  if(state.screen==="build") paintBuild(false);
  if(state.screen==="quiz") paintQuiz();
  if(state.screen==="rhyme") paintRhyme();
  if(state.screen==="hunt") paintHunt();
  if(state.screen==="miss") paintMiss();
  if(state.screen==="check") paintCheck();
  if(state.screen==="equation") paintEquation();
  if(state.screen==="sentfill") paintSentFill();
  if(state.screen==="digraph") paintDigraph();
  if(state.screen==="tenfill") paintTenFill();
  if(state.screen==="hop") paintHop();
  if(state.screen==="coins") paintShop();
  if(state.screen==="gunint") paintGunint();

    const inp = document.getElementById("nameInput");

    const inp = document.getElementById("writeInput");
    if(inp){ inp.focus(); inp.addEventListener("keydown", e=>{ if(e.key==="Enter") checkWrite(); }); }
  }
}

/* ---------------- Init ---------------- */
(function init(){
  const lastKey = (function(){ try{ return localStorage.getItem(LASTUSER_KEY); }catch(e){ return null; } })();
  if(lastKey && profiles[lastKey]){
    const p = profiles[lastKey];
    state.userName = p.displayName;
    state.avatar = p.avatar;
    state.stars = p.stars;
    state.stats = ensureStats(p);
    state.screen = "subject";
  }else{
    state.screen = Object.keys(profiles).length ? "profiles" : "name";
  }
  render();
})();
